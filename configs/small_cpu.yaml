# Small config for CPU testing
data:
  source: synth
  num_train_scenes: 2000
  num_val_scenes: 400
  batch_size: 4
  num_workers: 0
  T_hist: 11
  T_fut: 80
  synthetic_seed: 42

model:
  model: diffusion
  objective: ddpm
  d_model: 64
  num_layers: 2
  num_heads: 2
  ff_dim: 256
  dropout: 0.1
  polyline_dim: 32
  encoder_layers: 2
  max_agents: 32
  max_polylines: 256
  max_polyline_points: 30
  diffusion_steps: 100

train:
  num_epochs: 3
  learning_rate: 1e-3
  weight_decay: 1e-4
  warmup_steps: 100
  gradient_clip_norm: 1.0
  log_every: 50
  val_every: 200
  checkpoint_every: 500
  amp: false
  amp_dtype: float32
  ema_decay: 0.999
  seed: 42

planner:
  planner: diffusion
  num_samples: 6
  sampler: ddim
  sampler_steps: 10
  planning_horizon: 10
  replan_freq: 1

output_dir: runs/small_cpu
